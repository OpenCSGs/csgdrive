<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
<title id="title">AgentDrive entity relationships</title><desc id="description">Core catalog, ordered revision parents, shared file index, S3 gateway sessions and content storage. Solid arrows mark SQLite foreign keys. Dashed arrows mark application references, including cross-database IDs and remote ancestry. Table cards list selected columns.</desc>
