<rect x="28" y="917" width="1544" height="432" rx="10" fill="#ffffff" stroke="#c5d0d8"/>
<text x="48" y="950" class="section" text-anchor="start">Additional catalog and service entities</text>
<text x="1554" y="949" class="db" text-anchor="end">meta.db</text>
<text x="51" y="985" class="section" text-anchor="start">Directory, collaboration and history</text>
<text x="572" y="985" class="section" text-anchor="start">Publication and housekeeping</text>
<text x="1080" y="985" class="section" text-anchor="start">Operations and storage state</text>
<text x="52" y="1023" class="entity" text-anchor="start">workspace_selections</text>
<text x="52" y="1044" class="note" text-anchor="start">Current branch per workspace; FK to branches.</text>
<text x="52" y="1078" class="entity" text-anchor="start">mounts  ·  merges  ·  sync_jobs</text>
<text x="52" y="1099" class="note" text-anchor="start">Local mount, merge target and queued job reference a branch.</text>
<text x="52" y="1133" class="entity" text-anchor="start">collaborations  ·  remote_refs</text>
<text x="52" y="1154" class="note" text-anchor="start">Per-workspace collaboration and observed branch references.</text>
<text x="52" y="1188" class="entity" text-anchor="start">node_deltas  ·  branch_history</text>
<text x="52" y="1209" class="note" text-anchor="start">Changed paths and retained branch history roots.</text>
<text x="52" y="1243" class="entity" text-anchor="start">cache_pins</text>
<text x="52" y="1264" class="note" text-anchor="start">Preserves selected revision paths in a workspace.</text>
<text x="573" y="1023" class="entity" text-anchor="start">objects</text>
<text x="573" y="1044" class="note" text-anchor="start">PK (workspace_id, hash); catalog of cached objects.</text>
<text x="573" y="1078" class="entity" text-anchor="start">metadata_objects</text>
<text x="573" y="1099" class="note" text-anchor="start">FK (workspace_id, hash) → objects; stores tree and index bytes.</text>
<text x="573" y="1133" class="entity" text-anchor="start">object_usage</text>
<text x="573" y="1154" class="note" text-anchor="start">Tracks cached bytes and bytes protected from collection.</text>
<text x="573" y="1188" class="entity" text-anchor="start">published_refs</text>
<text x="573" y="1209" class="note" text-anchor="start">Scoped by target and workspace_id; branch_id can be NULL.</text>
<text x="573" y="1243" class="entity" text-anchor="start">metadata  ·  server_settings</text>
<text x="573" y="1264" class="note" text-anchor="start">Database identity, schema version and daemon settings.</text>
<text x="1080" y="1023" class="entity" text-anchor="start">operations</text>
<text x="1080" y="1044" class="note" text-anchor="start">Local operation identified by principal and request_id.</text>
<text x="1080" y="1078" class="entity" text-anchor="start">replicated_operations</text>
<text x="1080" y="1099" class="note" text-anchor="start">Published operation receipts observed from another location.</text>
<text x="1080" y="1133" class="entity" text-anchor="start">merge_history_publications</text>
<text x="1080" y="1154" class="note" text-anchor="start">FK operation → operations.id; records the published sequence.</text>
<text x="1080" y="1188" class="entity" text-anchor="start">Catalog read views</text>
<text x="1080" y="1209" class="note" text-anchor="start">Restore workspace, branch and revision records, including ordered parents.</text>
<text x="1080" y="1243" class="entity" text-anchor="start">Content storage</text>
<text x="1080" y="1264" class="note" text-anchor="start">RustFS/S3 stores file bytes. Codes stores Git chunks or LFS pointers.</text>
</svg>
