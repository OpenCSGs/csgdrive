[package]
name = "agentdrive-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentdrive-model.workspace = true
agentdrive-ports.workspace = true
async-trait.workspace = true
bytes.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true

cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
libc.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
reqwest.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winfsp_wrs = "0.4.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
agentdrive-config.workspace = true
agentdrive-engine.workspace = true
agentdrive-local.workspace = true
agentdrive-test-support.workspace = true
